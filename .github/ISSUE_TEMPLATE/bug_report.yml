name: Bug report
description: Something isn't working
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / build
      description: App version, commit, or tag.
  - type: textarea
    id: context
    attributes:
      label: Environment
      description: Device, OS, browser… whatever is relevant.
