# MANAGED BY zikty-ops — do not edit here; change it in zikty-ops and re-run sync-workflows.sh
# GitFlow: when the release-candidate PR is MERGED into main, promote the RC to
# the final tag + GitHub Release.
name: release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release-candidate')
    uses: zikty/zikty-ops/.github/workflows/reusable-release.yml@main
    with:
      prerelease: false
    secrets: inherit
