# MANAGED BY zikty-ops — do not edit here; change it in zikty-ops and re-run sync-workflows.sh
# GitFlow: on a develop->main PR labeled "release-candidate", run the gate and,
# if it passes, cut an RC prerelease (vX.Y.Z-rc.N) as a rehearsal of the final tag.
name: release candidate

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [main]

jobs:
  gate:
    if: contains(github.event.pull_request.labels.*.name, 'release-candidate')
    uses: zikty/zikty-ops/.github/workflows/reusable-release-gate.yml@main
    secrets: inherit

  rc:
    needs: gate
    if: needs.gate.outputs.can_release == 'true'
    uses: zikty/zikty-ops/.github/workflows/reusable-release.yml@main
    with:
      prerelease: true
    secrets: inherit
