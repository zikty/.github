name: build debug apps
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

# The repo's default GITHUB_TOKEN is read-only and a reusable can't exceed its
# caller's permissions — declare them here or the reusable fails at startup.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-debug-apps'
    uses: zikty/zikty-ops/.github/workflows/reusable-build-debug-apps.yml@v1
    secrets: inherit
