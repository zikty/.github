name: release
on:
  pull_request:
    types: [labeled, closed]
    branches: [main]

# The repo's default GITHUB_TOKEN is read-only and a reusable can't exceed its
# caller's permissions — declare them here or the reusable fails at startup.
# contents: write covers tagging + GitHub Release creation in reusable-release.
permissions:
  contents: write

jobs:
  # Label a develop->main PR `release-candidate` to run the gate and cut an RC.
  gate:
    if: github.event.action == 'labeled' && github.event.label.name == 'release-candidate'
    uses: zikty/zikty-ops/.github/workflows/reusable-release-gate.yml@main
    secrets: inherit
  rc:
    needs: gate
    if: github.event.action == 'labeled' && needs.gate.outputs.can_release == 'true'
    uses: zikty/zikty-ops/.github/workflows/reusable-release.yml@main
    with:
      prerelease: true
    secrets: inherit
  # Merging that PR promotes the RC to the final tag.
  final:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release-candidate')
    uses: zikty/zikty-ops/.github/workflows/reusable-release.yml@main
    with:
      prerelease: false
    secrets: inherit
