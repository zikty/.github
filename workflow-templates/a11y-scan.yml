name: a11y scan
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

# The repo's default GITHUB_TOKEN is read-only and a reusable can't exceed its
# caller's permissions — declare them here or the reusable fails at startup.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  a11y:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'a11y-scan'
    uses: zikty/zikty-ops/.github/workflows/reusable-a11y-scan.yml@v1
    secrets: inherit
