name: version bump
on:
  workflow_dispatch:
    inputs:
      bump:
        description: patch | minor | major
        type: choice
        options: [patch, minor, major]
        default: patch

# The repo's default GITHUB_TOKEN is read-only and a reusable can't exceed its
# caller's permissions — declare them here or the reusable fails at startup.
permissions:
  contents: write

jobs:
  bump:
    uses: zikty/zikty-ops/.github/workflows/reusable-version-bump.yml@v1
    with:
      bump: ${{ inputs.bump }}
    secrets: inherit
